name: Build orca-daemon (macOS)

on:
  push:
    branches:
      - main
    paths: &build_paths
      - "deps/**"
      - "deps_src/**"
      - "cmake/**"
      - "src/libslic3r/**"
      - "src/daemon/**"
      - "src/CMakeLists.txt"
      - "CMakeLists.txt"
      - "version.inc"
      - "build_release_macos.sh"
      - ".github/workflows/build-daemon-macos.yml"
  pull_request:
    branches:
      - main
    paths: *build_paths
  workflow_dispatch:

concurrency:
  group: build-daemon-macos-${{ github.event.pull_request.number || github.ref }}
  # Pushes run to the end, so they always save the caches pull requests restore.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must match between the deps build and the daemon build.
  HEADLESS_CMAKE_ARGS: -DSLIC3R_GUI=OFF -DSLIC3R_CAD=OFF
  # Same minimum macOS as the OrcaSlicer release builds (build_orca.yml).
  OSX_DEPLOYMENT_TARGET: "10.15"
  # Bump to invalidate the deps cache without touching deps/.
  DEPS_CACHE_VERSION: v1

jobs:
  build:
    name: Build orca-daemon macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          # Uncomment for an Intel build. It cross-compiles on the arm64
          # runner, as the OrcaSlicer release builds do.
          # - arch: x86_64
          #   os: macos-15
    runs-on: ${{ matrix.os }}
    # A cold deps build takes a couple of hours on a hosted runner.
    timeout-minutes: 300
    env:
      DEPS_BUILD_DIR: ${{ github.workspace }}/deps/build/${{ matrix.arch }}
      DEPS_PATH: ${{ github.workspace }}/deps/build/${{ matrix.arch }}/OrcaSlicer_dep

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: "false"

      # Keyed before anything writes into deps/, since hashFiles covers it.
      - name: Compute deps cache key
        id: deps_key
        shell: bash
        run: echo "key=daemon-deps-macos-${{ matrix.arch }}-${{ env.OSX_DEPLOYMENT_TARGET }}-${{ env.DEPS_CACHE_VERSION }}-${{ hashFiles('deps/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore deps
        id: deps_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPS_PATH }}
          key: ${{ steps.deps_key.outputs.key }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      - name: Install build tools
        shell: bash
        run: brew install automake texinfo libtool pkgconf yasm nasm

      - name: Free disk space
        shell: bash
        run: |
          df -hI /
          # Deleting the unused Xcodes takes minutes, so only do it when the
          # build might not fit.
          avail_gib=$(df -g / | awk 'NR == 2 { print $4 }')
          if [ "$avail_gib" -ge 15 ]; then
            echo "$avail_gib GiB free, enough for the build"
            exit 0
          fi
          xcode=$(basename "$(cd "$(xcode-select -p)/../.." && pwd -P)")
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "$xcode" -exec rm -rf {} +
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -hI /

      # -j 3: hosted macOS runners have 3 cores and 7 GB of RAM.
      - name: Build deps
        if: steps.deps_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./build_release_macos.sh -dx -j 3 -a ${{ matrix.arch }} -t ${{ env.OSX_DEPLOYMENT_TARGET }} -- ${{ env.HEADLESS_CMAKE_ARGS }}
          # Keep only the installed deps; the intermediate build trees are
          # large and not needed for the daemon build.
          find "$DEPS_BUILD_DIR" -mindepth 1 -maxdepth 1 ! -name OrcaSlicer_dep -exec rm -rf {} +

      # Saved straight away, so a failing daemon build does not throw away a
      # multi-hour deps build.
      - name: Save deps
        if: steps.deps_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DEPS_PATH }}
          key: ${{ steps.deps_key.outputs.key }}

      - name: Name the compiler cache leg
        shell: bash
        run: |
          leg="daemon-macOS-${{ matrix.arch }}"
          echo "CCACHE_LEG=$leg" >> "$GITHUB_ENV"
          echo "CCACHE_ENTRY=ccache-$leg-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Compiler cache
        id: ccache
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ env.CCACHE_LEG }}
          max-size: 1G
          restore: false
          save: false
          job-summary: ""

      - name: Restore compiler cache
        id: ccache_restore
        if: ${{ steps.ccache.outcome == 'success' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ env.CCACHE_ENTRY }}
          restore-keys: ccache-${{ env.CCACHE_LEG }}-

      - name: Enable compiler cache
        if: ${{ steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"
          echo "CCACHE_DEPEND=1" >> "$GITHUB_ENV"
          ccache -z

      # Configured directly rather than through build_release_macos.sh -s,
      # which packages OrcaSlicer.app and so needs the GUI build.
      - name: Build orca-daemon
        shell: bash
        run: |
          # cmake 4.x compatibility workaround, as in build_release_macos.sh.
          export CMAKE_POLICY_VERSION_MINIMUM=3.10
          cmake -S . -B build/${{ matrix.arch }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.OSX_DEPLOYMENT_TARGET }} \
            -DCMAKE_IGNORE_PREFIX_PATH="/opt/local:/usr/local:/opt/homebrew" \
            -DDEP_BUILD_DIR="$DEPS_BUILD_DIR" \
            -DORCA_DAEMON=ON \
            ${{ env.HEADLESS_CMAKE_ARGS }}
          cmake --build build/${{ matrix.arch }} --config Release --target orca-daemon -j 3

      # The daemon looks for Orca's resources at <exe dir>/../Resources on
      # macOS (src/daemon/paths.hpp).
      - name: Package orca-daemon
        shell: bash
        run: |
          pkg=orca-daemon_macOS_${{ matrix.arch }}_${GITHUB_SHA::7}
          echo "PKG_NAME=$pkg" >> "$GITHUB_ENV"
          mkdir -p "dist/$pkg/bin"
          cp build/${{ matrix.arch }}/src/daemon/orca-daemon "dist/$pkg/bin/"
          cp -R resources "dist/$pkg/Resources"
          cp LICENSE.txt "dist/$pkg/"
          find "dist/$pkg" -name '.DS_Store' -delete
          lipo -info "dist/$pkg/bin/orca-daemon"
          # Everything but system libraries must be linked statically, or the
          # binary will not run on another Mac.
          otool -L "dist/$pkg/bin/orca-daemon"
          if otool -L "dist/$pkg/bin/orca-daemon" | tail -n +2 | grep -Ev '^\s+(/usr/lib/|/System/Library/)'; then
            echo "::error::orca-daemon links a non-system dynamic library"
            exit 1
          fi
          tar -czf "$pkg.tar.gz" -C dist "$pkg"

      - name: Upload orca-daemon
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PKG_NAME }}.tar.gz
          # Upload the tarball as-is instead of wrapping it in a zip; the
          # tarball keeps the executable bit, a zip artifact would not.
          archive: false
          if-no-files-found: error

      - name: Summarize orca-daemon
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          size=$(du -h "$PKG_NAME.tar.gz" | cut -f1)
          sha=$(shasum -a 256 "$PKG_NAME.tar.gz" | cut -d' ' -f1)
          {
            echo "## orca-daemon macOS ${{ matrix.arch }}"
            echo
            echo "| Package | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| [\`$PKG_NAME.tar.gz\`]($ARTIFACT_URL) | $size | \`$sha\` |"
            echo
            echo "The binary is not signed or notarized. After downloading, clear the"
            echo "quarantine flag before running it:"
            echo
            echo '```bash'
            echo "tar -xzf $PKG_NAME.tar.gz"
            echo "xattr -dr com.apple.quarantine $PKG_NAME"
            echo "./$PKG_NAME/bin/orca-daemon --help"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compiler cache statistics
        if: ${{ always() && steps.ccache.outcome == 'success' }}
        shell: bash
        run: |
          ccache --evict-older-than 7d
          ccache -s -v || ccache -s

      - name: Save compiler cache
        id: ccache_save
        if: ${{ always() && steps.ccache_restore.outcome == 'success' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ env.CCACHE_ENTRY }}

      - name: Drop older compiler cache entries
        if: ${{ always() && steps.ccache_save.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh cache list --ref "$GITHUB_REF" --key "$CCACHE_ENTRY" --json key \
              | jq -e --arg entry "$CCACHE_ENTRY" 'any(.[]; .key == $entry)' > /dev/null; then
            echo "$CCACHE_ENTRY was not saved; keeping the older entries."
            exit 0
          fi
          gh cache list --ref "$GITHUB_REF" --key "ccache-$CCACHE_LEG-" --limit 100 --json id,key \
            | jq -r --arg prefix "ccache-$CCACHE_LEG-" --argjson run "$GITHUB_RUN_ID" \
                '.[] | select((.key | ltrimstr($prefix) | split("-")[0] | tonumber?) < $run) | .id' \
            | while read -r id; do gh cache delete "$id"; done
